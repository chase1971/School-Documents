<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conics Animations</title>
  <!-- GENERATED by build-hub.js from hub.template.html — edit the template, not this file. -->
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --text: #e8eef4;
      --muted: #9db0c4;
      --accent: #5eb8ff;
      --accent2: #7ee787;
      --border: #3d5166;
      --video-h: clamp(300px, calc(100vh - 400px), 620px);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.3;
      font-size: 18px;
    }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 0.75rem 1.25rem 1rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.6rem; }
    .layout {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      grid-template-areas: "list stage";
      gap: 1.25rem;
      align-items: start;
    }
    .list { grid-area: list; }
    .stage {
      grid-area: stage;
      position: sticky;
      top: 0.5rem;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 0.75rem;
    }
    h2 { font-size: 1.05rem; margin: 1rem 0 0.4rem; color: var(--accent); }
    h2:first-child { margin-top: 0; }
    .clip-grid { display: grid; gap: 0.5rem; }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      min-height: 56px;
      padding: 0.6rem 1rem;
      transition: border-color 0.15s, background 0.15s;
    }
    button:hover:not(:disabled),
    button:focus-visible { border-color: var(--accent); background: var(--surface2); outline: none; }
    button:disabled { opacity: 0.4; cursor: default; }
    button[aria-current="true"],
    button[aria-pressed="true"] { border-color: var(--accent2); background: var(--surface2); }
    .clip-btn { display: block; width: 100%; text-align: left; font-size: 1.05rem; }
    .now-playing { margin: 0 0 0.5rem; font-weight: 600; color: var(--accent2); min-height: 1.3rem; }
    .video-wrap { cursor: pointer; }
    video {
      display: block;
      width: 100%;
      height: var(--video-h);
      object-fit: contain;
      border-radius: 10px;
      background: #000;
    }
    .row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .row > button { flex: 1 1 0; text-align: center; padding: 0.4rem 0.5rem; }
    .row.secondary > button { min-height: 46px; font-size: 0.95rem; color: var(--muted); }
    .row[hidden] { display: none; }
    @keyframes pulse {
      0%, 100% { border-color: var(--border); }
      50% { border-color: var(--accent2); }
    }
    .pulse { animation: pulse 1.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; border-color: var(--accent2); } }
    @media (max-width: 720px) {
      :root { --video-h: min(42vh, 360px); }
      .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "stage" "list"; }
      .stage { z-index: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Conics Animations</h1>
    <div class="layout">
      <div class="list" id="list"></div>
      <div class="stage">
        <p class="now-playing" id="now-playing">Pick a clip.</p>
        <div class="video-wrap" id="video-wrap">
          <video id="player" playsinline muted disablePictureInPicture preload="auto"></video>
        </div>
        <div class="row" id="mode-row" role="group" aria-label="Playback mode">
          <button type="button" id="mode-auto" aria-pressed="true">Auto</button>
          <button type="button" id="mode-slow" aria-pressed="false">Slow</button>
          <button type="button" id="restart">Restart</button>
        </div>
        <div class="row" id="parts-row" role="group" aria-label="Clip parts" hidden></div>
        <div class="row" id="step-row">
          <button type="button" id="pause">Pause</button>
          <button type="button" id="back" aria-label="Previous step">Back</button>
          <button type="button" id="next" aria-label="Next step">Next</button>
        </div>
        <div class="row secondary">
          <button type="button" id="prev-clip">Previous clip</button>
          <button type="button" id="next-clip">Next clip</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CLIPS = /*__CLIPS__*/[];

    // Port of the student portal player (useVideoExamplePlayer / useVideoStepNavigation).
    // Auto: plays through, pausing where each part begins. Slow: holds at every step; Next plays to the next one.
    const STEP_STOP_LEAD = 0.03;
    const START_EPSILON = 0.12;
    const END_EPSILON = 0.08;

    const $ = (id) => document.getElementById(id);
    const list = $("list");
    const video = $("player");
    const nowPlaying = $("now-playing");
    const modeAuto = $("mode-auto");
    const modeSlow = $("mode-slow");
    const partsRow = $("parts-row");
    const stepRow = $("step-row");
    const pauseBtn = $("pause");
    const backBtn = $("back");
    const nextBtn = $("next");
    const prevClipBtn = $("prev-clip");
    const nextClipBtn = $("next-clip");

    let clipIndex = -1;
    let clip = null;
    let mode = "auto";
    let stepIndex = 0;
    let stepTarget = null;
    let stepTargetIndex = null;
    let finished = false;
    let awaiting = true;
    let previousTime = 0;
    let loading = false;
    let loadText = "";
    let loadToken = 0;
    let videoFailed = false;
    const blobCache = new Map();
    const clipButtons = [];
    const ready = () => clip != null && !loading && video.readyState >= 1;

    // Brightspace ignores HTTP Range requests, so a video loaded straight from its URL cannot seek
    // (every jump snaps back to 0:00). Download the file once and play it from memory instead.
    async function clipBlobUrl(index, token) {
      if (blobCache.has(index)) return blobCache.get(index);
      const r = await fetch(CLIPS[index].src, { credentials: "include" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const total = Number(r.headers.get("content-length")) || 0;
      const reader = r.body.getReader();
      const chunks = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        got += value.length;
        if (total && token === loadToken) {
          loadText = "Loading… " + Math.round((got / total) * 100) + "%";
          render();
        }
      }
      const url = URL.createObjectURL(new Blob(chunks, { type: "video/mp4" }));
      blobCache.set(index, url);
      return url;
    }

    const steps = () => (clip ? clip.steps : [0]);
    const lastStep = () => steps().length - 1;
    const hasSteps = () => steps().length > 1;
    const isPlaying = () => !video.paused && !video.ended;
    const partStops = () =>
      clip ? clip.parts.slice(1).map((p) => p.start).filter((t) => t > 0) : [];

    function stepIndexAtTime(t) {
      const s = steps();
      let index = 0;
      for (let i = 1; i < s.length; i += 1) {
        if (t >= s[i] - START_EPSILON) index = i;
      }
      return index;
    }

    function safePlay() {
      const p = video.play();
      if (p && p.catch) p.catch(() => render());
    }

    function clearTarget() {
      stepTarget = null;
      stepTargetIndex = null;
    }

    function pauseSlowAtStep(index) {
      video.pause();
      video.currentTime = steps()[index] ?? 0;
      clearTarget();
      stepIndex = index;
      const atLast = index >= lastStep();
      awaiting = index === 0 && !atLast;
      finished = atLast;
      render();
    }

    function playFromStart() {
      if (mode === "slow" && hasSteps()) { pauseSlowAtStep(0); return; }
      clearTarget();
      video.currentTime = 0;
      stepIndex = 0;
      finished = false;
      awaiting = false;
      safePlay();
      render();
    }

    function endClip() {
      video.pause();
      video.currentTime = Math.max(0, clip.end - END_EPSILON);
      clearTarget();
      finished = true;
      awaiting = false;
      render();
    }

    function togglePauseAuto() {
      if (!ready()) return;
      if (video.paused) {
        if (finished || video.currentTime >= clip.end - END_EPSILON) { playFromStart(); return; }
        finished = false;
        awaiting = false;
        safePlay();
      } else {
        video.pause();
      }
      render();
    }

    function stepNext() {
      if (!ready() || !hasSteps()) return;
      const s = steps();
      const last = lastStep();
      if (mode === "auto") {
        clearTarget();
        const at = stepIndexAtTime(video.currentTime);
        if (at >= last) return;
        const n = at + 1;
        video.currentTime = s[n];
        stepIndex = n;
        awaiting = false;
        if (n >= last) {
          video.pause();
          finished = true;
        } else {
          finished = false;
          safePlay();
        }
        render();
        return;
      }
      if (stepIndex >= last && stepTarget == null) return;
      finished = false;
      awaiting = false;
      if (stepTarget != null) {
        const begin = stepTargetIndex ?? stepIndex + 1;
        if (begin >= last) { pauseSlowAtStep(last); return; }
        const to = begin + 1;
        video.currentTime = s[begin];
        stepTarget = s[to];
        stepTargetIndex = to;
        safePlay();
        render();
        return;
      }
      const n = stepIndex + 1;
      stepTarget = s[n];
      stepTargetIndex = n;
      safePlay();
      render();
    }

    function stepBack() {
      if (!ready() || !hasSteps()) return;
      const s = steps();
      const playingToward = stepTargetIndex;
      clearTarget();
      const at = stepIndexAtTime(video.currentTime);
      const n = playingToward != null
        ? Math.max(0, playingToward - 1)
        : Math.max(0, Math.min(stepIndex, at) - 1);
      if (mode === "auto") {
        video.currentTime = s[n];
        stepIndex = n;
        finished = false;
        awaiting = false;
        safePlay();
        render();
        return;
      }
      pauseSlowAtStep(n);
    }

    function jumpToPart(startSeconds) {
      if (!ready() || !hasSteps()) return;
      clearTarget();
      const index = stepIndexAtTime(startSeconds);
      if (index === 0) { playFromStart(); return; }
      if (mode === "slow") { pauseSlowAtStep(index); return; }
      video.currentTime = steps()[index];
      stepIndex = index;
      finished = false;
      awaiting = false;
      safePlay();
      render();
    }

    function setMode(next) {
      if (next === mode) return;
      mode = next;
      if (!ready()) { render(); return; }
      clearTarget();
      const atEnd = video.currentTime >= clip.end - END_EPSILON;
      const at = hasSteps() ? stepIndexAtTime(video.currentTime) : 0;
      stepIndex = at;
      if (mode === "auto") {
        finished = atEnd;
        awaiting = false;
        if (atEnd) video.pause(); else safePlay();
      } else {
        video.pause();
        awaiting = !atEnd && video.currentTime < START_EPSILON && at === 0;
        finished = atEnd;
      }
      render();
    }

    function onSurfaceClick() {
      if (!ready()) return;
      if (mode === "slow" && hasSteps()) {
        if (isPlaying()) {
          clearTarget();
          video.pause();
          render();
        } else if (stepIndex < lastStep()) {
          stepNext();
        }
        return;
      }
      togglePauseAuto();
    }

    async function selectClip(index) {
      if (index < 0 || index >= CLIPS.length) return;
      if (index === clipIndex && !loading) { if (ready()) playFromStart(); return; }
      clipIndex = index;
      clip = CLIPS[index];
      clearTarget();
      stepIndex = 0;
      finished = false;
      awaiting = true;
      previousTime = 0;
      const token = ++loadToken;
      videoFailed = false;
      loading = true;
      loadText = "Loading…";
      video.pause();
      video.removeAttribute("src");
      video.load();
      render();
      try {
        const url = await clipBlobUrl(index, token);
        if (token !== loadToken) return;
        loading = false;
        video.src = url;
        video.load();
      } catch (err) {
        if (token !== loadToken) return;
        loading = false;
        loadText = "This video could not be loaded.";
        clip = null;
        clipIndex = -1;
      }
      render();
    }

    video.addEventListener("loadedmetadata", () => {
      video.currentTime = 0;
      previousTime = 0;
      stepIndex = 0;
      finished = false;
      awaiting = true;
      if (mode === "slow" && hasSteps()) { pauseSlowAtStep(0); return; }
      playFromStart();
    });
    video.addEventListener("play", () => { awaiting = false; if (mode !== "slow") finished = false; render(); });
    video.addEventListener("pause", render);
    video.addEventListener("ended", () => { finished = true; awaiting = false; render(); });
    video.addEventListener("error", () => { if (video.getAttribute("src")) { videoFailed = true; loadText = "This video could not be loaded."; render(); } });

    video.addEventListener("timeupdate", () => {
      if (!clip) return;
      if (mode === "slow" && hasSteps()) {
        if (stepTarget != null) {
          if (video.currentTime >= stepTarget - STEP_STOP_LEAD) pauseSlowAtStep(stepTargetIndex ?? stepIndex + 1);
          return;
        }
        if (!video.paused) { video.pause(); }
        return;
      }
      if (hasSteps() && !video.paused) {
        const synced = stepIndexAtTime(video.currentTime);
        if (synced !== stepIndex) { stepIndex = synced; render(); }
      }
      if (video.currentTime >= clip.end - END_EPSILON && !video.paused) endClip();
    });

    // Per-frame check: pause Auto where a part begins, stop Slow exactly on the next step.
    function frame() {
      if (clip && video.readyState >= 1) {
        const now = video.currentTime;
        if (mode === "auto" && !video.paused) {
          const stop = partStops().find((t) => previousTime < t && previousTime >= t - 0.5 && now >= t - STEP_STOP_LEAD);
          if (stop != null) { video.currentTime = stop; video.pause(); }
        }
        if (mode === "slow" && stepTarget != null && now >= stepTarget - STEP_STOP_LEAD) {
          pauseSlowAtStep(stepTargetIndex ?? stepIndex + 1);
        } else if (mode === "auto" && !video.paused && now >= clip.end - END_EPSILON) {
          endClip();
        }
        previousTime = video.currentTime;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    function renderParts() {
      const want = clip && hasSteps() && clip.parts.length > 1 ? clip.parts : [];
      partsRow.hidden = want.length === 0;
      if (partsRow.childElementCount !== want.length || partsRow.dataset.clip !== String(clipIndex)) {
        partsRow.textContent = "";
        partsRow.dataset.clip = String(clipIndex);
        want.forEach((part) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = part.label;
          b.addEventListener("click", () => jumpToPart(part.start));
          partsRow.appendChild(b);
        });
      }
      const at = clip ? (steps()[stepIndex] ?? 0) + 0.05 : 0;
      let active = 0;
      want.forEach((part, i) => { if (part.start <= at) active = i; });
      [...partsRow.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === active)));
    }

    function render() {
      const playing = isPlaying();
      const nav = clip != null && hasSteps() && !loading;
      modeAuto.setAttribute("aria-pressed", String(mode === "auto"));
      modeSlow.setAttribute("aria-pressed", String(mode === "slow"));
      clipButtons.forEach((b, i) => {
        if (i === clipIndex) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
      });
      if (loading || videoFailed || (!clip && loadText)) nowPlaying.textContent = loadText;
      else if (clip) nowPlaying.textContent = clip.group.replace(/s$/, "") + " — " + clip.label;
      pauseBtn.hidden = mode === "slow" && nav;
      pauseBtn.disabled = !ready() || !(playing || awaiting || !video.paused || video.currentTime > 0 || finished);
      pauseBtn.textContent = playing ? "Pause" : awaiting ? "Play" : "Resume";
      backBtn.disabled = !nav || !(stepIndex > 0 || playing);
      const nextEnabled = nav && stepIndex < lastStep();
      nextBtn.disabled = !nextEnabled;
      nextBtn.classList.toggle("pulse", mode === "slow" && nextEnabled && !playing);
      prevClipBtn.disabled = clipIndex <= 0;
      nextClipBtn.disabled = clipIndex < 0 || clipIndex >= CLIPS.length - 1;
      renderParts();
    }

    let grid = null;
    let lastGroup = null;
    CLIPS.forEach((c, i) => {
      if (c.group !== lastGroup) {
        const h = document.createElement("h2");
        h.textContent = c.group;
        list.appendChild(h);
        grid = document.createElement("div");
        grid.className = "clip-grid";
        list.appendChild(grid);
        lastGroup = c.group;
      }
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "clip-btn";
      btn.textContent = c.label;
      btn.addEventListener("click", () => selectClip(i));
      grid.appendChild(btn);
      clipButtons.push(btn);
    });

    modeAuto.addEventListener("click", () => setMode("auto"));
    modeSlow.addEventListener("click", () => setMode("slow"));
    $("restart").addEventListener("click", () => { if (ready()) playFromStart(); });
    pauseBtn.addEventListener("click", togglePauseAuto);
    backBtn.addEventListener("click", stepBack);
    nextBtn.addEventListener("click", stepNext);
    prevClipBtn.addEventListener("click", () => selectClip(clipIndex - 1));
    nextClipBtn.addEventListener("click", () => selectClip(clipIndex + 1));
    $("video-wrap").addEventListener("click", onSurfaceClick);
    render();
  </script>
</body>
