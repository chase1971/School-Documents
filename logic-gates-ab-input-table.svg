<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="140" height="200" viewBox="0 0 140 200" role="img" aria-label="Truth table inputs A and B">
  <rect width="140" height="200" fill="#ffffff"/>
  <g stroke="#111827" stroke-width="2" fill="none">
    <rect x="0" y="0" width="70" height="40"/>
    <rect x="70" y="0" width="70" height="40"/>
    <rect x="0" y="40" width="70" height="40"/>
    <rect x="70" y="40" width="70" height="40"/>
    <rect x="0" y="80" width="70" height="40"/>
    <rect x="70" y="80" width="70" height="40"/>
    <rect x="0" y="120" width="70" height="40"/>
    <rect x="70" y="120" width="70" height="40"/>
    <rect x="0" y="160" width="70" height="40"/>
    <rect x="70" y="160" width="70" height="40"/>
  </g>
  <g font-family="'Times New Roman', Times, serif" font-size="22" fill="#111827" text-anchor="middle" dominant-baseline="middle">
    <text x="35" y="20" font-style="italic" font-weight="400">A</text>
    <text x="105" y="20" font-style="italic" font-weight="400">B</text>
